<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAIMI-Lab | Welcome</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            text-align: center;
            background: white;
            border-radius: 12px;
            padding: 60px 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            animation: fadeIn 0.6s ease-in-out;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        h1 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 15px;
            font-weight: 700;
        }
        
        .subtitle {
            color: #764ba2;
            font-size: 1.2em;
            margin-bottom: 30px;
            font-weight: 500;
        }
        
        .status-badge {
            display: inline-block;
            background: #ffc107;
            color: #333;
            padding: 10px 20px;
            border-radius: 50px;
            font-weight: 600;
            margin: 20px 0;
            font-size: 0.95em;
        }
        
        .message {
            color: #555;
            font-size: 1.05em;
            line-height: 1.6;
            margin: 30px 0;
        }
        
        .footer {
            margin-top: 40px;
            color: #999;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔬 HAIMI-Lab</h1>
        <p class="subtitle">Welcome to HAIMI-Lab</p>
        
        <div class="status-badge">⚙️ Under Development</div>
        
        <div class="message">
            <p>This webpage is currently under development. We're working hard to bring you an amazing experience!</p>
            <p style="margin-top: 15px;">Please check back soon for more updates and information about our research and projects.</p>
        </div>
        
        <div class="footer">
            <p>HAIMI-Lab © 2026</p>
        </div>
    </div>
</body>
</html>
